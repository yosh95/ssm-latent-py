[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssm-latent"
version = "0.1.0"
description = "Latent world models in pure PyTorch: Mamba-3 style selective SSM (exp-trapezoidal, complex rotation, MIMO) x JEPA/LeJEPA"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yoshihiro Ando" }]
keywords = ["world-model", "state-space-model", "mamba", "jepa", "lejepa", "ssm", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/yosh95/ssm-latent-py"
Source = "https://github.com/yosh95/ssm-latent-py"
Related = "https://github.com/yosh95/ssm-latent-rs"

[tool.hatch.build.targets.wheel]
packages = ["src/ssm_latent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
